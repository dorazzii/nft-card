<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFT preview card component</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <article class="card">
      <a class="card__media" href="#" aria-label="View Equilibrium #3429">
        <img src="images/image-equilibrium.jpg" alt="Equilibrium #3429 artwork">
        <span class="card__overlay" aria-hidden="true">
          <svg width="48" height="32" viewBox="0 0 24 16" fill="#fff"><path d="M12 0C6.5 0 2 3.6 0 8c2 4.4 6.5 8 12 8s10-3.6 12-8c-2-4.4-6.5-8-12-8Zm0 13a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
        </span>
      </a>

      <h1 class="card__title"><a href="#">Equilibrium #3429</a></h1>
      <p class="card__text">Our Equilibrium collection promotes balance and calm.</p>

      <div class="card__stats">
        <p class="price">
          <svg width="10" height="16" viewBox="0 0 10 16" fill="#00ffff" aria-hidden="true"><path d="M5 0 0 8l5 3 5-3L5 0Zm0 12.2L0 9.2 5 16l5-6.8-5 3Z"/></svg>
          0.041 ETH
        </p>
        <p class="time">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="#8bacd9" aria-hidden="true"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0Zm0 14.5a6.5 6.5 0 1 1 0-13 6.5 6.5 0 0 1 0 13Zm.75-10.5h-1.5v4.5l3.6 2.2.75-1.2-2.85-1.7V4Z"/></svg>
          3 days left
        </p>
      </div>

      <footer class="card__author">
        <img src="images/image-avatar.png" alt="" width="32" height="32">
        <p>Creation of <a href="#">Jules Wyvern</a></p>
      </footer>
    </article>
  </main>
</body>
</html>
